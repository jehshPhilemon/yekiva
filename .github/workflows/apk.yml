name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/validate-packs.mjs
      - run: npm test --prefix app
      - run: npm test --prefix server

  apk:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # L'app appelle l'API Yekiva TTS DIRECTEMENT (aucun serveur à héberger).
      # Secrets GitHub (Settings -> Secrets -> Actions) :
      #   TTS_API_URL = https://api.jehshphilemon.com (requis)
      #   TTS_API_KEY = YKV-.... (requis : sans elle l'API répond 401)
      - name: Bake API URL + key (fail-closed: refuses silent APK)
        env:
          TTS_API_URL: ${{ secrets.TTS_API_URL }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
        run: |
          if [ -z "$TTS_API_URL" ]; then
            echo "::error::TTS_API_URL secret manquant — sans lui l'APK serait muet."
            echo "::error::Ajoutez-le : GitHub -> Settings -> Secrets -> Actions -> TTS_API_URL=https://api.jehshphilemon.com"
            exit 1
          fi
          if [ -z "$TTS_API_KEY" ]; then
            echo "::warning::TTS_API_KEY secret manquant — l'API répondra 401 (cache + voix téléphone uniquement)."
          fi
          node tools/build-config.mjs
          node tools/build-config.mjs --check

      - name: Install app deps
        working-directory: app
        run: npm install

      - name: Add Android platform (first build only)
        working-directory: app
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Patch Android manifest (permissions + cleartext for http:// API)
        run: node tools/patch-android.mjs app/android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yekiva-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
